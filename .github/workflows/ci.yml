# ShopEx continuous integration: the quality gates of docs/ARCHITECTURE.md section 7.
# Render deploys only after these checks pass (autoDeployTrigger: checksPass in render.yaml).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies (pinned)
        run: python -m pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Formatting (ruff format)
        run: ruff format --check .

      - name: Tests with coverage (pytest, fails under 85 %)
        run: pytest --cov --cov-report=term-missing

      - name: Static security analysis (bandit)
        run: bandit -r app -ll

      - name: Dependency vulnerability audit (pip-audit)
        run: pip-audit -r requirements.txt

  client:
    name: Client (Expo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies (lockfile)
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Lint (expo lint)
        run: npm run lint

      - name: Unit tests (jest)
        run: npm test -- --ci

      - name: Dependency vulnerability audit (npm audit)
        run: npm audit --omit=dev --audit-level=high

      - name: Web export (expo export -p web)
        run: npx expo export -p web
        env:
          EXPO_PUBLIC_API_URL: https://shopex-api.onrender.com
