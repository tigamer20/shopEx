# Daily data refresh (stores + demo prices) — ARCHITECTURE.md requirement 4.
# Calls POST /api/v1/admin/refresh on the deployed API. Both values come from repository secrets:
#   SHOPEX_API_URL      e.g. https://shopex-api.onrender.com (no trailing path)
#   SHOPEX_ADMIN_TOKEN  the ADMIN_TOKEN value generated by Render for shopex-api
name: Daily refresh

on:
  schedule:
    - cron: "0 9 * * *" # every day at 09:00 UTC
  workflow_dispatch:

# The job never touches the repository, so it gets no token permissions at all.
permissions: {}

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh stores and prices
    runs-on: ubuntu-latest
    # Worst case: ~9 min of wake-up retries + 3 refresh attempts of up to 10 min each.
    timeout-minutes: 45
    steps:
      - name: Call the admin refresh endpoint
        env:
          SHOPEX_API_URL: ${{ secrets.SHOPEX_API_URL }}
          SHOPEX_ADMIN_TOKEN: ${{ secrets.SHOPEX_ADMIN_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$SHOPEX_API_URL" ] || [ -z "$SHOPEX_ADMIN_TOKEN" ]; then
            echo "::error::Set the SHOPEX_API_URL and SHOPEX_ADMIN_TOKEN repository secrets."
            exit 1
          fi
          SHOPEX_API_URL="${SHOPEX_API_URL%/}"

          # 1) Wake the service. A free Render instance sleeps after 15 min idle and needs about a
          #    minute to start, so retry the (safe, idempotent) health check several times.
          curl -fsS -o /dev/null --max-time 60 \
            --retry 6 --retry-delay 20 --retry-all-errors \
            "$SHOPEX_API_URL/api/v1/health"
          echo "API is awake."

          # 2) Trigger the refresh. Retries cover transient failures only (timeouts, 429, 5xx),
          #    never a 403/404, so a wrong or missing token fails fast. The token is passed in a
          #    header and never printed; the response is a JSON summary of counts and timestamps.
          curl -fsS --max-time 600 \
            --retry 2 --retry-delay 30 \
            -X POST "$SHOPEX_API_URL/api/v1/admin/refresh" \
            -H "X-Admin-Token: $SHOPEX_ADMIN_TOKEN"
          echo
          echo "Refresh completed."
