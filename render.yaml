# ShopEx — Render Blueprint (https://render.com/docs/blueprint-spec)
#
# Creates two Render resources from this repository:
#   shopex-api  FastAPI web service (backend/), region Ohio
#   shopex-web  Expo web export served as a static site (client/, global CDN)
#
# The database is NOT hosted on Render: it is a Neon Postgres project in AWS US East 2 (Ohio), next
# to the API. Its pooled connection string is entered as DATABASE_URL in the Render dashboard when
# the Blueprint is first applied (docs/DEPLOY_RENDER.md, steps 1 and 2).
#
# The public URLs below assume Render assigns https://shopex-api.onrender.com and
# https://shopex-web.onrender.com. If a name is taken, Render appends a suffix: update CORS_ORIGINS,
# EXPO_PUBLIC_API_URL and the CSP connect-src accordingly (docs/DEPLOY_RENDER.md, step 4).
#
# Secrets are never written here: JWT_SECRET and ADMIN_TOKEN are generated by Render, and
# DATABASE_URL (sync: false) is typed into the dashboard.

services:
  # --- API ------------------------------------------------------------------
  - type: web
    name: shopex-api
    runtime: python
    plan: free
    # Same AWS region as the Neon database (aws-us-east-2). Cannot be changed after creation.
    # Static sites take no region: they are served from Render's global CDN.
    region: ohio
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    # Deploy only once the GitHub Actions CI checks of the commit have passed.
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.8"
      - key: ENV
        value: production
      # Neon pooled connection string (postgresql://...-pooler...?sslmode=require&...).
      # Render asks for it when the Blueprint is created; it is never stored in the repository.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        value: https://shopex-web.onrender.com
      - key: DEMO_STORES_FALLBACK
        value: "false"

  # --- Web app (static) --------------------------------------------------------
  - type: web
    name: shopex-web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npx expo export -p web
    # Relative to rootDir (client/), where `expo export` writes its output.
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "24.22.1"
      # Baked into the bundle at build time. This must be the API's PUBLIC URL: a `fromService`
      # host reference resolves to a private-network hostname that browsers cannot reach.
      - key: EXPO_PUBLIC_API_URL
        value: https://shopex-api.onrender.com
    routes:
      # Single-page app: unknown paths fall back to the router entry point.
      # Existing files (JS bundles, assets) are served before this rule applies.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      # Keeps the origin on cross-origin requests: the OSM tile usage policy requires a Referer.
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Permissions-Policy
        value: geolocation=(self), camera=(), microphone=(), payment=(), usb=()
      # The itinerary map is an <iframe srcdoc> that loads Leaflet 1.9.4 from unpkg (with SRI) and
      # OpenStreetMap tiles. A srcdoc frame inherits this policy, so its inline bootstrap script
      # needs 'unsafe-inline' in script-src (see docs/SECURITY.md for the hardening path).
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self' 'unsafe-inline' https://unpkg.com;
          style-src 'self' 'unsafe-inline' https://unpkg.com;
          img-src 'self' data: blob: https://tile.openstreetmap.org https://unpkg.com;
          font-src 'self' data:;
          connect-src 'self' https://shopex-api.onrender.com;
          frame-src 'self' blob: data:;
          worker-src 'self' blob:;
          manifest-src 'self';
          object-src 'none';
          base-uri 'self';
          form-action 'self';
          frame-ancestors 'none';
          upgrade-insecure-requests
      # Expo emits content-hashed bundles under /_expo/static/: safe to cache forever.
      - path: /_expo/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
